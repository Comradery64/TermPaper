<!doctype html>
<!-- The app icon, drawn with TermPaper's own paper styling (src/style.css) at icon scale:
     ruled sheet, plum margin, punched holes, ink debossed into the paper, fiber grain.
     Rendered by tools/icon/render.sh. -->
<meta charset="utf-8">
<style>
@font-face { font-family: "Victor Cursive"; src: url("../../public/fonts/VictorMono-BoldItalic.woff2"); font-weight: 700; }
@font-face { font-family: "Victor Cursive"; src: url("../../public/fonts/VictorMono-Italic.woff2"); font-weight: 400; }
:root {
  --paper: #f4f4f4; --rule-color: #9fcbea; --margin: #b57ab2; --hole: #a9d4f1;
  --ink: #0e1e80; --graphite: #24262e;
  --rule: 168px;      /* row pitch at icon scale */
  --first: 300px;     /* first visible rule: blank top strip above it, as in the app */
}
html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
#sheet {
  position: absolute; inset: 0; overflow: hidden;
  background: url("../../public/paper.png") 0 0 / 1024px 1024px, var(--paper);
  background-blend-mode: multiply, normal;
}
#rules {
  position: absolute; left: 0; right: 0; top: var(--first); bottom: 0;
  background: repeating-linear-gradient(to bottom,
    var(--rule-color) 0, var(--rule-color) 6px, transparent 6px, transparent var(--rule));
}
#margin { position: absolute; top: 0; bottom: 0; left: 268px; width: 10px; background: var(--margin); opacity: 0.9; }
/* punched holes, lit from the top-left: shaded upper wall, lit lower wall, raised rim (app values ×6) */
.hole {
  position: absolute; left: 92px; width: 104px; height: 104px; margin-top: -52px; border-radius: 50%;
  background: var(--hole);
  box-shadow:
    inset 6px 10px 13px rgba(20, 24, 40, 0.30),
    inset -4px -5px 6px rgba(255, 255, 255, 0.55),
    4px 5px 0 rgba(255, 255, 255, 0.75),
    -2px -3px 2px rgba(20, 24, 40, 0.10);
}
/* writing: baseline rests on a rule, descenders cross it; debossed like the app's glyphs */
.line {
  position: absolute; left: 318px; white-space: pre; line-height: 1;
  font-family: "Victor Cursive", monospace; opacity: 0.93;
  text-shadow: -3px -4px 4px rgba(20, 24, 40, 0.35), 4px 5px 0 rgba(255, 255, 255, 0.85);
}
.prompt { color: var(--graphite); font-weight: 400; }
.typed { color: var(--ink); font-weight: 700; }
.cursor { display: inline-block; width: 0.5em; height: 0.07em; margin-left: 0.08em; background: var(--ink); vertical-align: -0.02em; }
/* fine fiber tooth over everything so ink is broken by the paper grain (as #grain in the app) */
#grain { position: absolute; inset: 0;
  background: url("../../public/paper.png") 0 0 / 1024px 1024px;
  filter: invert(1) brightness(4); mix-blend-mode: screen; }
/* soft room light from the top-left */
#light { position: absolute; inset: 0;
  background: radial-gradient(ellipse 90% 80% at 25% 15%, rgba(255,255,250,0.18), transparent 70%),
              radial-gradient(ellipse 140% 120% at 50% 45%, transparent 60%, rgba(40,40,50,0.12) 100%); }
</style>
<div id="sheet">
  <div id="rules"></div>
  <div id="margin"></div>
  <div class="hole" style="top: 18%"></div>
  <div class="hole" style="top: 82%"></div>
  <!-- each line's bottom edge = its rule; font metrics place the baseline a third of an em up from the box bottom -->
  <div class="line" id="l1"><span class="prompt" style="font-size:150px">~ %</span></div>
  <div class="line" id="l2"><span class="typed" style="font-size:250px">ls</span><span class="cursor typed" style="font-size:250px"></span></div>
  <div id="grain"></div>
  <div id="light"></div>
</div>
<script>
  // sit each line's baseline on a rule (descenders cross it, like the app's 1/3-em shift)
  const rule = 168, first = 300;
  const place = (id, row, size) => {
    const el = document.getElementById(id);
    const asc = 1.0 * size;   // Victor Mono hhea ascent = 1.0 em; line-height 1 box ≈ ascent+descent, centred
    const box = size;         // line-height: 1
    const baseInBox = (box - (1.0 + 0.2273) * size) / 2 + asc;
    el.style.top = `${first + rule * row - baseInBox + 0.08 * size}px`;
  };
  place("l1", 1, 150);
  place("l2", 3, 250);
</script>
